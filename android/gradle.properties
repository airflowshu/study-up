org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# 固定用 JDK 17 构建：系统默认 JDK 25 与 Gradle 8.3 不兼容。
#
# 注意：这是本机绝对路径，CI 的 Ubuntu runner 上没有 F: 盘，Gradle 会直接报
# "Java home supplied is invalid" 起不来。.github/workflows/release.yml 里
# 构建前会用 sed 把这一行删掉，改由 setup-java 提供 JDK 17。
# 若哪天要把仓库交给别人构建，这一行应改为由环境变量提供。
org.gradle.java.home=F:/Program Files/Java/ms-17.0.19
