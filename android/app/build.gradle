plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ---- 发布签名配置 ----
//
// 口令与密钥库位置放在 android/key.properties（已 gitignore），CI 上由
// .github/workflows/release.yml 从 secrets 还原。
//
// 为什么必须换掉 debug 签名：
//   1. debug 密钥是 AGP 自动生成、每台机器都不一样的。换机器/重装 SDK 后
//      签名会变，用户装新版必须先卸载 —— 而本项目 allowBackup=false，
//      卸载即丢本地 SQLite，只能靠云端重新同步。
//   2. debug 证书的 APK 无法上架、无法被其他应用正常信任，
//      部分 ROM 的「未知来源」策略对它更严。
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new java.util.Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// release 构建缺密钥时直接中断，不静默退回 debug 签名 ——
// 「不小心又发了 debug 签名的正式包」正是这次要根除的问题。
// 用 taskGraph 而非配置期抛错，保证 debug 构建与 flutter run 不受影响。
gradle.taskGraph.whenReady { graph ->
    if (hasReleaseKeystore) return
    def wantsRelease = graph.allTasks.any { it.name.toLowerCase().contains("release") }
    if (wantsRelease) {
        throw new GradleException(
            "\n✗ 缺少 android/key.properties，无法给 release 包签名。\n" +
            "  本机：确认 android/key.properties 与 android/upload-keystore.jks 都在。\n" +
            "  CI ：确认 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /\n" +
            "       ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 四个 secrets 已配置。\n" +
            "  仅为调试而临时绕过：flutter run --profile（不走 release 变体）。\n"
        )
    }
}

android {
    namespace = "com.shuge.homework_app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId = "com.shuge.homework_app"
        // Android 8.0 起支持（需求文档 minSdk 26）
        minSdk = 26
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }


    // 让 .so 在 APK 里用 deflate 压缩，而不是原样存储。
    //
    // AGP 8 默认 extractNativeLibs=false：libflutter.so / libapp.so 直接以未压缩
    // 形式躺在包里（arm64 那套就是 10.3 MB + 6.6 MB），安装快但包大得离谱。
    // 打开后引擎压到约 4.8 MB、业务代码约 2.7 MB，整个包从 18 MB 降到 8.7 MB。
    // 代价是安装时要解压到 /data/app：安装略慢、磁盘多占 ~17 MB，Android 6+ 都支持，
    // 已在 Android 8.0 的平板上实测通过。
    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseKeystore ? signingConfigs.release : null
        }
    }
}

flutter {
    source = "../.."
}
